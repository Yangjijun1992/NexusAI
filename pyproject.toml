[project]
name = "nexusai-lite"
version = "0.1.0"
description = "NexusAI Lite - 智能 API 错峰调度与夜间开发工具（单用户/小团队）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
nexusai-lite = "nexusai_lite.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "basedpyright>=1.21",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nexusai_lite"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["var"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "ISC001",
    "D203",
    "D213",
    "CPY001",
    "TD002",
    "TD003",
    "FIX002",
    # 中文项目有意使用全角标点（ambiguous-unicode 规则不适用于 CJK 文本）
    "RUF001",
    "RUF002",
    "RUF003",
    # 中文 docstring 不强制英文句尾标点
    "D415",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",
    "ARG",
    "PLR2004",
    "SLF001",
    "D",
]
"src/nexusai_lite/cli.py" = [
    "T201",  # CLI 入口有意使用 print 输出
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
pythonPlatform = "All"
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/.venv", "**/build", "**/dist"]
